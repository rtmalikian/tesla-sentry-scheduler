[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tesla-sentry-scheduler"
version = "0.1.0"
description = "Tesla Sentry Scheduler — put Sentry Mode on a real schedule (nights only, work hours only). Cut phantom drain without losing nighttime security."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raphael Malikian", email = "rtmalikian@gmail.com" }]
keywords = ["tesla", "fleet-api", "sentry-mode", "phantom-drain", "home-automation", "scheduling"]
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]

[project.scripts]
tcc-sentry = "tesla_sentry_scheduler.cli:main"

[project.urls]
Homepage = "https://github.com/rtmalikian/tesla-sentry-scheduler"
Issues = "https://github.com/rtmalikian/tesla-sentry-scheduler/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
